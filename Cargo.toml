[package]
name = "maga"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Unified TUI manager for global MCP servers across Antigravity, Claude Code, GitHub Copilot, Grok CLI, and OpenCode"
repository = "https://github.com/akrista/maga"
homepage = "https://github.com/akrista/maga"
readme = "README.md"
license = "MIT"
keywords = ["mcp", "tui", "ratatui", "claude", "copilot"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**/*", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tachyonfx = { version = "0.25", default-features = false, features = ["std"] }
tempfile = "3.14"
toml = "1.2"
unicode-width = "0.2"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
self-replace = "1.5"
sha2 = "0.10"

[profile.release]
lto = true
strip = true
codegen-units = 1

