[package]
name = "maga"
version = "0.1.0"
edition = "2024"
description = "Unified TUI manager for global MCP servers across Antigravity, Claude Code, GitHub Copilot, Grok CLI, and OpenCode"
repository = "https://github.com/akrista/maga"
homepage = "https://github.com/akrista/maga"
readme = "README.md"
license = "MIT"
keywords = ["mcp", "tui", "ratatui", "claude", "copilot"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**/*", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tachyonfx = { version = "0.21", default-features = false, features = ["std", "crossterm"] }
tempfile = "3.14"
toml = "0.8"
unicode-width = "0.2"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

